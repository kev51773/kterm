[package]
name = "kterm"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2.0", features = ["wry", "devtools"] }
portable-pty = "0.8"
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
futures-util = "0.3"

[features]
default = ["wry"]
wry = ["tauri/wry"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }
