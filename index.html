<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kterm</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="tab-bar" data-tauri-drag-region>
        <button id="tab-scroll-left" class="tab-scroll-btn titlebar-btn" data-tauri-drag-region="false" title="Scroll Left" aria-label="Scroll Tabs Left">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor">
            <path d="M10.47 12.53a.75.75 0 0 1-1.06 0l-4-4a.75.75 0 0 1 0-1.06l4-4a.75.75 0 0 1 1.06 1.06L6.81 8l3.66 3.47a.75.75 0 0 1 0 1.06z"/>
          </svg>
        </button>
        <div id="tabs-scroll-container" data-tauri-drag-region>
          <div id="tabs-list" data-tauri-drag-region></div>
        </div>
        <button id="tab-scroll-right" class="tab-scroll-btn titlebar-btn" data-tauri-drag-region="false" title="Scroll Right" aria-label="Scroll Tabs Right">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor">
            <path d="M5.53 12.53a.75.75 0 0 0 1.06 0l4-4a.75.75 0 0 0 0-1.06l-4-4a.75.75 0 0 0-1.06 1.06L9.19 8l-3.66 3.47a.75.75 0 0 0 0 1.06z"/>
          </svg>
        </button>
        <div class="tab-add-group" data-tauri-drag-region="false">
          <button id="add-tab-btn" class="titlebar-btn" data-tauri-drag-region="false" title="New Tab (Default Shell)">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
              <path d="M8 2a.75.75 0 0 1 .75.75v4.5h4.5a.75.75 0 0 1 0 1.5h-4.5v4.5a.75.75 0 0 1-1.5 0v-4.5h-4.5a.75.75 0 0 1 0-1.5h4.5v-4.5A.75.75 0 0 1 8 2z"/>
            </svg>
          </button>
          <button id="tab-dropdown-btn" class="titlebar-btn" data-tauri-drag-region="false" title="Menu">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
              <path d="M4.47 6.47a.75.75 0 0 1 1.06 0L8 8.94l2.47-2.47a.75.75 0 1 1 1.06 1.06l-3 3a.75.75 0 0 1-1.06 0l-3-3a.75.75 0 0 1 0-1.06z"/>
            </svg>
          </button>
        </div>
        <div id="titlebar-drag-spacer" data-tauri-drag-region></div>
        <div id="window-controls" data-tauri-drag-region="false">
          <button id="win-min-btn" data-tauri-drag-region="false" title="Minimize">
            <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.2">
              <line x1="0" y1="5" x2="10" y2="5" />
            </svg>
          </button>
          <button id="win-max-btn" data-tauri-drag-region="false" title="Maximize / Restore">
            <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.2">
              <rect x="0.6" y="0.6" width="8.8" height="8.8" />
            </svg>
          </button>
          <button id="win-close-btn" data-tauri-drag-region="false" title="Close">
            <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.2">
              <path d="M1 1L9 9M9 1L1 9" />
            </svg>
          </button>
        </div>
      </div>
      <div id="terminal-container"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
